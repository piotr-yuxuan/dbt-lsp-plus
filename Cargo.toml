[package]
name = "dbt-lsp-plus"
version = "0.1.19"
edition = "2024"
rust-version = "1.89"
description = "A proxy in front of dbt lsp that adds the LSP features it lacks"
license = "EUPL-1.2 OR GPL-3.0-or-later"
repository = "https://github.com/piotr-yuxuan/dbt-lsp-plus"
homepage = "https://github.com/piotr-yuxuan/dbt-lsp-plus"
readme = "README.md"
keywords = ["dbt", "lsp", "language-server", "sql", "jinja"]
categories = ["development-tools", "text-editors"]
default-run = "dbt-lsp-plus"
publish = false

[dependencies]
regex = "1.13.1"
serde_json = "1.0.154"
url = "2.5.8"
yaml-rust2 = "0.13.0"

# A scripted stand-in for dbt lsp, for the integration tests.
[[bin]]
name = "fake-dbt-lsp"
path = "tests/support/fake_dbt_lsp.rs"
test = false
doc = false

[lints.clippy]
cognitive_complexity = "warn"

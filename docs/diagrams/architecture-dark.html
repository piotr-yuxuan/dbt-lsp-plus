<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>How dbt-lsp-plus sits between a client and dbt</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #1d1f21;
      --color-ink:     #c5c8c6;
      --color-muted:   #a8aaa8;
      --color-accent:  #b294bb;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 960px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; height: auto; min-width: 880px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · dbt-lsp-plus</p>
    <h1>How dbt-lsp-plus sits between a client and dbt</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 880 404" width="880" height="404" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
        <title id="architecture-dark-title">How dbt-lsp-plus sits between a client and dbt</title>
        <desc id="architecture-dark-desc">An editor or an agent speaks LSP to dbt-lsp-plus, which forwards every message to dbt lsp unchanged and answers what it lacks from its scan of the project's files, the manifest of its own dbt parse and the files of the user's last run; without dbt lsp, as with dbt-oss, it answers alone.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8aaa8"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b294bb"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#81a2be"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#1d1f21"/>

        <line x1="548" y1="64" x2="663" y2="64" stroke="#81a2be" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <path d="M 664,232 H 596 Q 588,232 588,224 V 116 Q 588,108 580,108 H 549" fill="none" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="432" y1="120" x2="432" y2="199" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="464" y1="200" x2="464" y2="121" stroke="#a8aaa8" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Arrow labels -->
        <rect x="252" y="46" width="64" height="12" rx="2" fill="#1d1f21"/>
        <text x="284" y="55" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REQUESTS</text>
        <rect x="236" y="94" width="48" height="12" rx="2" fill="#1d1f21"/>

        <rect x="576" y="46" width="60" height="12" rx="2" fill="#1d1f21"/>

        <rect x="596" y="94" width="48" height="12" rx="2" fill="#1d1f21"/>

        <rect x="308" y="164" width="32" height="12" rx="2" fill="#1d1f21"/>
        <text x="324" y="173" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCAN</text>
        <rect x="596" y="164" width="40" height="12" rx="2" fill="#1d1f21"/>

        <rect x="380" y="154" width="44" height="12" rx="2" fill="#1d1f21"/>
        <text x="402" y="163" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SPAWN</text>
        <rect x="472" y="154" width="52" height="12" rx="2" fill="#1d1f21"/>
        <text x="498" y="163" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MANIFEST</text>

        <rect x="40" y="40" width="180" height="80" rx="6" fill="#1d1f21"/>

        <text x="130" y="102" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">LSP on stdio</text>

        <rect x="348" y="40" width="200" height="80" rx="6" fill="#1d1f21"/>

        <text x="448" y="86" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">dbt-lsp-plus</text>
        <text x="448" y="102" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">answers what dbt lsp lacks</text>
        <!-- Node: dbt lsp (optional) -->
        <rect x="664" y="40" width="176" height="80" rx="6" fill="#1d1f21"/>
        <rect x="664" y="40" width="176" height="80" rx="6" fill="rgba(197,200,198,0.03)" stroke="#969896" stroke-width="1" stroke-dasharray="5,4"/>

        <text x="752" y="86" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">dbt lsp</text>
        <text x="752" y="102" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">proprietary · optional</text>
        <!-- Node: the project's files (store) -->
        <rect x="40" y="200" width="180" height="64" rx="6" fill="#1d1f21"/>
        <rect x="40" y="200" width="180" height="64" rx="6" fill="rgba(197,200,198,0.05)" stroke="#a8aaa8" stroke-width="1"/>
        <rect x="48" y="208" width="32" height="12" rx="2" fill="none" stroke="rgba(197,200,198,0.3)" stroke-width="0.8"/>
        <text x="64" y="217" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="130" y="238" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Project files</text>
        <text x="130" y="254" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SQL · YAML · packages</text>
        <!-- Node: dbt parse (process) -->
        <rect x="348" y="200" width="200" height="64" rx="6" fill="#1d1f21"/>
        <rect x="348" y="200" width="200" height="64" rx="6" fill="#282a2e" stroke="#c5c8c6" stroke-width="1"/>
        <rect x="356" y="208" width="48" height="12" rx="2" fill="none" stroke="rgba(197,200,198,0.3)" stroke-width="0.8"/>
        <text x="380" y="217" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">PROCESS</text>
        <text x="448" y="238" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">dbt parse</text>
        <text x="448" y="254" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the user's dbt, as the user runs it</text>
        <!-- Node: the last run (store) -->
        <rect x="664" y="200" width="176" height="64" rx="6" fill="#1d1f21"/>
        <rect x="664" y="200" width="176" height="64" rx="6" fill="rgba(197,200,198,0.05)" stroke="#a8aaa8" stroke-width="1"/>
        <rect x="672" y="208" width="32" height="12" rx="2" fill="none" stroke="rgba(197,200,198,0.3)" stroke-width="0.8"/>
        <text x="688" y="217" fill="#a8aaa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="752" y="238" fill="#c5c8c6" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The last run</text>
        <text x="752" y="254" fill="#a8aaa8" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">target/run_results.json</text>
        <!-- Callout, under dbt parse -->
        <line x1="448" y1="284" x2="448" y2="268" stroke="rgba(197,200,198,0.4)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="448" cy="267" r="2" fill="#c5c8c6"/>
        <text x="448" y="302" fill="#c5c8c6" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">Its output in a cache, and no package installed;</text>
        <text x="448" y="320" fill="#c5c8c6" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="middle">without dbt lsp, as with dbt-oss, the proxy answers alone.</text>

        <line x1="40" y1="344" x2="840" y2="344" stroke="rgba(197,200,198,0.1)" stroke-width="0.8"/>

        <rect x="120" y="372" width="14" height="10" rx="2" fill="rgba(178,148,187,0.1)" stroke="#b294bb" stroke-width="1"/>

        <rect x="196" y="372" width="14" height="10" rx="2" fill="#282a2e" stroke="#c5c8c6" stroke-width="1"/>
        <text x="216" y="381" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Process</text>
        <rect x="284" y="372" width="14" height="10" rx="2" fill="rgba(197,200,198,0.05)" stroke="#a8aaa8" stroke-width="1"/>
        <text x="304" y="381" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Files</text>
        <rect x="360" y="372" width="14" height="10" rx="2" fill="rgba(197,200,198,0.03)" stroke="#969896" stroke-width="1" stroke-dasharray="3,2"/>

        <text x="496" y="381" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">LSP messages</text>

        <text x="624" y="381" fill="#a8aaa8" font-size="9" font-family="'Geist', system-ui, sans-serif">Data or call</text>
      </svg>
    </div>
  </div>
</body>

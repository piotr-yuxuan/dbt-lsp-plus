#
# Every check, on every branch.  It holds no rule: the checks are in the Makefile, and
# docs/reference/release-pipeline.md describes this file.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Only a branch's tip must pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Each job: a branch of the repository is checked at its push, a pull request only when it
# comes from a fork, so that no branch is checked twice; the pull request's own commit, as
# GitHub's merge of it has a title no check accepts; the whole history, which the check of
# the commits reads back to main.  Measured locally: the tests in 32 s, the corpus and the
# live test in 5 s each; a runner's build and fetches take the rest of the time allowed.
jobs:
  static:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c make check-static
      - if: github.ref != 'refs/heads/main'
        run: nix develop -c make commits BASE=origin/main

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c make test

  # A beginning on macOS, whose result counts for neither CI nor a release, though CD waits
  # for it to finish: see the reference.
  macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c make test

  # The corpus on dbt-oss, then the live test, which has the proxy alone since dbt-oss has
  # no `dbt lsp`.  The binary is fetched outside the checkout and no cache holds it.
  dbt-oss:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - run: python3 scripts/fetch-dbt oss "$RUNNER_TEMP/dbt"
      # That runner's AppArmor otherwise refuses `unshare -r`, by which the tests run with
      # no network; and a job that cannot run them so fails rather than pass.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: unshare -rn true
      # Built with the network, then the corpus and the live test with none.
      - run: nix develop -c cargo test --locked -j 4 --test proxy --no-run
      - run: nix develop -c unshare -rn make conformance DBT_LSP_PLUS_TEST_DBT="$RUNNER_TEMP/dbt/dbt"
      - run: nix develop -c unshare -rn make live DBT_LSP_PLUS_TEST_DBT="$RUNNER_TEMP/dbt/dbt"

  # The proprietary build, under dbt Labs' licence, only once the owner sets the repository's
  # variable DBT_LSP_PLUS_PROPRIETARY to true, and on a push only.  While it is opt-in its
  # result counts for neither CI nor a release, though CD waits for it to finish: see the
  # reference.
  dbt:
    if: vars.DBT_LSP_PLUS_PROPRIETARY == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: cargo-${{ github.job }}-${{ runner.os }}-
      - run: python3 scripts/fetch-dbt proprietary "$RUNNER_TEMP/dbt"
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: unshare -rn true
      # Built with the network, then the corpus and the live test with none: dbt lsp runs
      # as the user's command gives it, with no flag of the proxy's.
      - run: nix develop -c cargo test --locked -j 4 --test proxy --no-run
      - run: nix develop -c unshare -rn make conformance DBT_LSP_PLUS_TEST_DBT="$RUNNER_TEMP/dbt/dbt"
      - run: nix develop -c unshare -rn make live DBT_LSP_PLUS_TEST_DBT="$RUNNER_TEMP/dbt/dbt"
